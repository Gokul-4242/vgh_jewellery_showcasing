<div class="auth-page bg-mesh">
  <!-- Animated Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Main Content -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="card-content">

        <!-- Login Form -->
        <div class="form-container" [class.active-form]="isLoginMode" [class.hidden-form]="!isLoginMode">
          <div class="form-header">
            <h1 class="form-title stagger-in delay-1">Welcome Back</h1>
            <p class="form-subtitle stagger-in delay-2">Please enter your credentials to access your premium vault.</p>
            <p class="error-text" *ngIf="errorMsg">{{ errorMsg }}</p>
          </div>

          <form novalidate (ngSubmit)="onLoginSubmit()" class="auth-form">
            <div class="field-group stagger-in delay-3">
              <label for="loginIdentifier" class="field-label">Email or Phone Number <span class="required-asterisk">*</span></label>
              <input type="text" id="loginIdentifier" name="identifier" [(ngModel)]="loginData.identifier" class="aura-input" placeholder="name@vghjewellers.com or 9876543210" required>
            </div>

            <div class="field-group stagger-in delay-4">
              <label for="loginPassword" class="field-label">Password <span class="required-asterisk">*</span></label>
              <div class="password-wrapper">
                <input [type]="showLoginPassword ? 'text' : 'password'" id="loginPassword" name="password" [(ngModel)]="loginData.password" class="aura-input" placeholder="••••••••" required>
                <button type="button" class="password-toggle" (click)="showLoginPassword = !showLoginPassword">
                  <span class="material-symbols-outlined">{{ showLoginPassword ? 'visibility_off' : 'visibility' }}</span>
                </button>
              </div>
            </div>

            <div class="remember-row stagger-in delay-5">
              <input type="checkbox" id="remember" class="form-checkbox">
              <label for="remember" class="checkbox-label">Remember device for 30 days</label>
            </div>

            <button type="submit" class="auth-btn stagger-in delay-6" [disabled]="isLoading">
              {{ isLoading ? 'Loading...' : 'Access Account' }}
            </button>
          </form>

          <div class="form-footer stagger-in delay-7">
            <p>New to VGH Jewellers? <button class="toggle-link" (click)="toggleForm()">Sign Up</button></p>
          </div>
        </div>

        <!-- Sign Up Form -->
        <div class="form-container" [class.active-form]="!isLoginMode" [class.hidden-form]="isLoginMode">
          <div class="form-header">
            <h2 class="form-title">Join VGH Jewellers</h2>
            <p class="form-subtitle">Enter the inner circle of luxury living.</p>
            <p class="error-text" *ngIf="errorMsg">{{ errorMsg }}</p>
          </div>

          <form novalidate (ngSubmit)="onSignupSubmit()" class="auth-form">
            <div class="field-group">
              <label for="fullName" class="field-label">Full Name <span class="required-asterisk">*</span></label>
              <div class="input-icon-wrapper">
                <span class="material-symbols-outlined input-icon">person</span>
                <input type="text" id="fullName" name="fullName" [(ngModel)]="signupData.fullName" class="aura-input icon-input" placeholder="Alexander Thorne" required>
              </div>
            </div>

            <div class="field-group">
              <label for="signupEmail" class="field-label">Email Address <span class="required-asterisk">*</span></label>
              <div class="input-icon-wrapper">
                <span class="material-symbols-outlined input-icon">mail</span>
                <input type="email" id="signupEmail" name="email" [(ngModel)]="signupData.email" class="aura-input icon-input" placeholder="alexander@vgh.luxury" required>
              </div>
            </div>

            <div class="field-group">
              <label for="signupPhone" class="field-label">Phone Number <span class="required-asterisk">*</span></label>
              <div class="input-icon-wrapper">
                <span class="material-symbols-outlined input-icon">phone</span>
                <input type="tel" id="signupPhone" name="phone" [(ngModel)]="signupData.phone" class="aura-input icon-input" placeholder="9876543210" required>
              </div>
            </div>

            <div class="two-col-grid">
              <div class="field-group">
                <label for="signupPassword" class="field-label">Password <span class="required-asterisk">*</span></label>
                <div class="password-wrapper">
                  <input [type]="showSignupPassword ? 'text' : 'password'" id="signupPassword" name="password" [(ngModel)]="signupData.password" class="aura-input" placeholder="••••••••" required>
                  <button type="button" class="password-toggle" (click)="showSignupPassword = !showSignupPassword">
                    <span class="material-symbols-outlined">{{ showSignupPassword ? 'visibility_off' : 'visibility' }}</span>
                  </button>
                </div>
              </div>
              <div class="field-group">
                <label for="confirmPassword" class="field-label">Confirm <span class="required-asterisk">*</span></label>
                <div class="password-wrapper">
                  <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" name="confirmPassword" [(ngModel)]="signupData.confirmPassword" class="aura-input" placeholder="••••••••" required>
                  <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword">
                    <span class="material-symbols-outlined">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="terms-group">
              <input type="checkbox" id="terms" name="agreeToTerms" [(ngModel)]="signupData.agreeToTerms" class="form-checkbox" required>
              <label for="terms" class="terms-label">
                I agree to the <a class="gold-link" href="#">Terms of Excellence</a> and <a class="gold-link" href="#">Privacy Policy</a>. <span class="required-asterisk">*</span>
              </label>
            </div>

            <button type="submit" class="auth-btn" [disabled]="isLoading">
              {{ isLoading ? 'Loading...' : 'Create Account' }}
            </button>
          </form>

          <div class="form-footer">
            <p>Already have an account? <button class="toggle-link" (click)="toggleForm()">Login</button></p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Custom Toast Message for Validation Errors -->
  <div class="toast-container" [class.toast-show]="showValidationToast">
    <div class="toast-box glass">
      <div class="toast-icon-wrapper">
        <span class="material-symbols-outlined toast-icon">warning</span>
      </div>
      <div class="toast-content">
        <h4 class="toast-title">Validation Notice</h4>
        <p class="toast-message">{{ validationToastMsg }}</p>
      </div>
      <button type="button" class="toast-close-btn" (click)="closeValidationToast()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>
</div>
