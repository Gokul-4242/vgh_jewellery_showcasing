<div class="stepper-wrapper">
  <div class="stepper-glass-panel">
    <div class="stepper-content">
      <!-- Background Connecting Line & Liquid Glitters Progress -->
      <div class="stepper-connector">
        <div class="stepper-progress-fill" 
             [class.has-progress]="currentStep > 1"
             [style.width]="progressWidth">
          <div class="liquid-glitter-layer"></div>
          <div class="liquid-sparkle-stream"></div>
          <div class="liquid-sparkle-stars" *ngIf="currentStep > 1">
            <span class="star-particle star-1">✦</span>
            <span class="star-particle star-2">✧</span>
            <span class="star-particle star-3">✦</span>
          </div>
        </div>
      </div>

      <!-- Step 1: Shipping -->
      <div class="step-item" 
           [class.active]="currentStep >= 1"
           [class.completed]="currentStep > 1"
           [class.clickable]="isClickable(1)"
           (click)="goToStep(1)"
           role="button"
           [attr.tabindex]="isClickable(1) ? 0 : null"
           [attr.title]="isClickable(1) ? 'Return to Shipping details' : null"
           (keydown.enter)="goToStep(1)">
        <div class="step-circle">
          <span *ngIf="currentStep <= 1">1</span>
          <span *ngIf="currentStep > 1" class="material-symbols-outlined checkmark-icon">check</span>
        </div>
        <span class="step-label">Shipping</span>
      </div>

      <!-- Step 2: Payment -->
      <div class="step-item" 
           [class.active]="currentStep >= 2"
           [class.completed]="currentStep > 2"
           [class.clickable]="isClickable(2)"
           (click)="goToStep(2)"
           role="button"
           [attr.tabindex]="isClickable(2) ? 0 : null"
           [attr.title]="isClickable(2) ? 'Proceed to Payment' : null"
           (keydown.enter)="goToStep(2)">
        <div class="step-circle">
          <span *ngIf="currentStep <= 2">2</span>
          <span *ngIf="currentStep > 2" class="material-symbols-outlined checkmark-icon">check</span>
        </div>
        <span class="step-label">Payment</span>
      </div>

      <!-- Step 3: Confirm -->
      <div class="step-item" 
           [class.active]="currentStep >= 3"
           [class.completed]="currentStep > 3"
           [class.clickable]="isClickable(3)"
           (click)="goToStep(3)"
           role="button"
           [attr.tabindex]="isClickable(3) ? 0 : null"
           [attr.title]="isClickable(3) ? 'View Confirmation' : null"
           (keydown.enter)="goToStep(3)">
        <div class="step-circle">
          <span>3</span>
        </div>
        <span class="step-label">Confirm</span>
      </div>

    </div>
  </div>
</div>
